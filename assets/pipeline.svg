<svg width="1000" height="214" viewBox="0 0 1000 214" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Delivery pipeline</title>
<desc id="d">Commit, build and test with GitHub Actions and Cloud Build, scan with SonarQube and Dependency-Track, package to Artifact Registry, deploy with Argo CD and Terraform, operate on GKE.</desc>
<defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mono{font-family:'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
</style>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#080D1A"/><stop offset="1" stop-color="#0F172A"/>
</linearGradient>
<filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
<feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="card"><rect width="1000" height="214" rx="16"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1000" height="214" fill="url(#bg)"/>
<text x="30" y="36" class="mono" font-size="12" letter-spacing="2.5" fill="#38BDF8">DELIVERY PIPELINE<tspan fill="#56657E" letter-spacing="0.5">   commit → production</tspan></text>

<g opacity="0">
<animate attributeName="opacity" values="1;0" keyTimes="0;0.7111" dur="9s" calcMode="discrete" repeatCount="indefinite"/>

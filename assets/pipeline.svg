<animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
</circle>
<text x="970" y="36" text-anchor="end" class="mono" font-size="12" fill="#FBBF24" textLength="50.4" lengthAdjust="spacingAndGlyphs">running</text>
</g>
<g>
<animate attributeName="opacity" values="0;1" keyTimes="0;0.7111" dur="9s" calcMode="discrete" repeatCount="indefinite"/>
